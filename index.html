<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windi Pramudya Wardani's Day</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MUSIK -->
  <audio id="bgm" loop>
    <source src="musik.mp3" type="audio/mpeg">
  </audio>

  <header>
    <h1 class="judul">Selamat Ulang Tahun Sayangg 🤍</h1>

    <!-- FOTO UTAMA -->
    <div class="main-photos">
      <img src="foto/foto1.jpeg" alt="Foto utama 1">
      <img src="foto/foto2.jpeg" alt="Foto utama 2">
      <img src="foto/foto3.jpeg" alt="Foto utama 3">
    </div>

    <p class="subtitle">
      Terima kasih sudah menjadi bagian terbaik dalam hidupku
    </p>
  </header>

  <section>
    <h2 class="section-title">Galeri dede bayi nya aku 📸</h2>

    <div class="gallery">
      <img src="foto/05082022_1.jpg">
      <img src="foto/12032023_1.jpg">
      <img src="foto/20012024_1.jpg">
    </div>
  </section>

  <p class="ending">
    Aku mungkin tidak sempurna, tapi perasaanku ke sayang selalu utuh dan tidak akan pernah berubah
  </p>

  <p class="footer">
    Made With Love 🫶🏻
  </p>

  <!-- SCRIPT -->
  <script>
    const bgm = document.getElementById("bgm");
    bgm.volume = 0.2;

    document.addEventListener("click", () => {
      if (bgm.paused) bgm.play();
    }, { once: true });
  </script>

</body>
</html>
