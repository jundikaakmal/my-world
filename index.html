<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Ulang Tahun Sayang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Selamat Ulang Tahun Sayang 💙</h1>
    <p class="subtitle">
      Terima kasih sudah menjadi bagian terindah dalam hidupku
    </p>

    <h2>Kenangan Kita 📸</h2>

    <div class="timeline">

      <details>
        <summary>📅 12 Maret 2023</summary>
        <div class="photos">
          <img src="foto/12032023_1.jpg">
          <img src="foto/12032023_2.jpg">
          <img src="foto/12032023_3.jpg">
        </div>
      </details>

      <details>
        <summary>📅 5 Agustus 2022</summary>
        <div class="photos">
          <img src="foto/05082022_1.jpg">
          <img src="foto/05082022_2.jpg">
        </div>
      </details>

      <details>
        <summary>📅 20 Januari 2024</summary>
        <div class="photos">
          <img src="foto/20012024_1.jpg">
        </div>
      </details>

    </div>

    <p class="footer">
      Dibuat dengan cinta 💙
    </p>
  </div>

  <!-- SCRIPT: HANYA SATU TANGGAL BISA DIBUKA -->
  <script>
    const allDetails = document.querySelectorAll("details");

    allDetails.forEach((detail) => {
      detail.addEventListener("toggle", () => {
        if (detail.open) {
          allDetails.forEach((other) => {
            if (other !== detail) {
              other.removeAttribute("open");
            }
          });
        }
      });
    });
  </script>

</body>
</html>
