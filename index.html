<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windi Pramudya Wardani’s Day 💙</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Music -->
  <audio id="bgm" loop>
    <source src="Bensound_Love_-_Romantic_Royalty_Free_Music.mp3" type="audio/mpeg">
  </audio>

  <header>
    <h1>Selamat Ulang Tahun Sayang 💙</h1>

    <!-- FOTO UTAMA -->
    <div class="main-photos">
      <img src="foto/foto1.jpeg" alt="Foto utama 1">
      <img src="foto/foto2.jpeg" alt="Foto utama 2">
      <img src="foto/foto3.jpeg" alt="Foto utama 3">
    </div>

    <p class="subtitle">
      Terima kasih sudah menjadi bagian terbaik dalam hidupku
    </p>
  </header>

  <section>
    <h2 class="section-title">Kenangan Kita 📸</h2>

    <div class="gallery">
      <img src="foto1.jpeg" alt="Kenangan 1">
      <img src="foto2.jpeg" alt="Kenangan 2">
      <img src="foto3.jpeg" alt="Kenangan 3">
      <img src="foto4.jpeg" alt="Kenangan 4">
      <img src="foto5.jpeg" alt="Kenangan 5">
      <img src="foto6.jpeg" alt="Kenangan 6">
    </div>
  </section>

  <footer>
    Aku mungkin tidak sempurna, tapi perasaanku ke kamu selalu utuh 🤍
  </footer>

  <script>
    const bgm = document.getElementById("bgm");

    document.addEventListener("click", () => {
      if (bgm.paused) {
        bgm.volume = 0.6;
        bgm.play();
      }
    }, { once: true });
  </script>

</body>
</html>
